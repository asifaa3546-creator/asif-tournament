
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASIF TOURNAMENT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#080b14;
    color:white;
}

header{
    background:linear-gradient(135deg,#6c00ff,#00c6ff);
    padding:25px 15px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    margin-top:8px;
    font-size:14px;
}

.container{
    width:92%;
    max-width:600px;
    margin:25px auto;
}

.title{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

.card{
    background:#111827;
    border:1px solid #26324a;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.card h2{
    color:#00d9ff;
    margin-bottom:15px;
}

.info{
    line-height:2;
    color:#d5d9e3;
}

.join-btn{
    width:100%;
    border:0;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    background:linear-gradient(90deg,#7b00ff,#00c6ff);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.join-btn:hover{
    opacity:.9;
}

#joinBox{
    display:none;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #39445c;
    background:#080b14;
    color:white;
    outline:none;
}

.submit-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.notice{
    text-align:center;
    color:#ffd54f;
    margin:20px 0;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🔥 ASIF TOURNAMENT</div>
    <div class="subtitle">Free Fire Tournament Platform</div>
</header>

<div class="container">

    <div class="notice">
        🏆 Tournament খেলুন • Skill দেখান • জিতুন
    </div>

    <h1 class="title">🎮 Available Tournament</h1>

    <div class="card">

        <h2>🔥 Free Fire Survival Match</h2>

        <div class="info">
            🎮 Game: Free Fire<br>
            👥 Mode: Solo<br>
            💰 Entry Fee: FREE<br>
            🏆 Prize: ঘোষণা করা হবে<br>
            📅 Date: শীঘ্রই<br>
            ⏰ Time: শীঘ্রই
        </div>

        <button class="join-btn" onclick="showJoin()">
            🚀 JOIN TOURNAMENT
        </button>

    </div>

    <div class="card" id="joinBox">

        <h2>📝 Tournament Join</h2>

        <input
            type="text"
            id="playerName"
            placeholder="Player Name"
        >

        <input
            type="text"
            id="uid"
            placeholder="Free Fire UID"
        >

        <input
            type="tel"
            id="phone"
            placeholder="Mobile Number"
        >

        <button class="submit-btn" onclick="joinTournament()">
            ✅ JOIN NOW
        </button>

    </div>

</div>

<footer>
    © 2026 ASIF TOURNAMENT
</footer>

<script>

function showJoin(){

    document.getElementById("joinBox").style.display="block";

    document.getElementById("joinBox")
    .scrollIntoView({
        behavior:"smooth"
    });

}

function joinTournament(){

    let name =
    document.getElementById("playerName").value.trim();

    let uid =
    document.getElementById("uid").value.trim();

    let phone =
    document.getElementById("phone").value.trim();

    if(name === "" || uid === "" || phone === ""){

        alert("⚠️ সব তথ্য পূরণ করুন!");

        return;
    }

    alert(
        "✅ Tournament Join Request সফল!\n\n"+
        "Player: "+name+
        "\nUID: "+uid+
        "\nMobile: "+phone
    );

}

</script>

</body>
</html>
